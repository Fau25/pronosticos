name: Histórico europeo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python europa.py historico 2024-07-01 2026-10-21
      - run: |
          git config user.name "pronosticos-bot"; git config user.email "pronosticos-bot@users.noreply.github.com"
          git add datos/europa_historico.json; git commit -m "Histórico europeo" && git pull --rebase -q && git push
