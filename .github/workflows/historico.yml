name: Histórico europeo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  historico:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python extra_ligas.py historico 2024-07-01 2026-10-30 es2 esf
      - run: |
          git config user.name "pronosticos-bot"; git config user.email "pronosticos-bot@users.noreply.github.com"
          git add datos/extra_historico.json; git commit -m "Histórico ligas extra" && git pull --rebase -q && git push
