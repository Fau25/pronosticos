name: Sonda (pruebas de fuentes)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Probar fuentes
        run: |
          mkdir -p registro; S=registro/sonda.txt; : > $S
          UA="Mozilla/5.0 (pronosticos personales)"
          prueba() { echo "=== $1" >> $S; curl -s -m 25 -A "$UA" -H "Accept: application/json" -w "\nHTTP %{http_code} %{size_download}B\n" "$1" | head -c 2500 >> $S; echo >> $S; }
          curl -s -m 25 -A "$UA" https://www.quiniela15.com/robots.txt > registro/q15_robots.txt
          curl -s -m 25 -A "$UA" https://www.quiniela15.com/ > registro/q15_inicio.html
          curl -s -m 25 -A "$UA" https://www.quiniela15.com/resultados-quiniela > registro/q15_resultados.html
          ls -la registro/q15_* >> $S
      - name: Guardar
        run: |
          git config user.name "pronosticos-bot"; git config user.email "pronosticos-bot@users.noreply.github.com"
          git add registro/sonda.txt registro/q15_* && git commit -m "Sonda de fuentes" && git push
