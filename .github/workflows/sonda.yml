name: Sonda (pruebas de fuentes)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Probar Understat
        run: |
          mkdir -p registro/sonda; cd registro/sonda
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -s -m 30 -A "$UA" -D cab_liga.txt -o liga.html https://understat.com/league/La_liga/2026
          curl -s -m 30 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://understat.com/league/La_liga/2026" -D cab_api.txt -o api.txt https://understat.com/getLeagueData/La_liga/2026
          curl -s -m 30 -A "$UA" -o partido.html https://understat.com/match/28000
          ls -la > lista.txt; head -c 3000 api.txt > api_inicio.txt; rm -f api.txt
          grep -o '<script[^>]*src="[^"]*"' liga.html > scripts.txt || true
          grep -o 'var [a-zA-Z]*\s*=' liga.html | sort | uniq -c > variables.txt || true
          for s in $(grep -o 'src="/[^"]*\.js[^"]*"' liga.html | cut -d'"' -f2 | head -8); do curl -s -m 30 -A "$UA" "https://understat.com$s" -o "js_$(basename ${s%%\?*})"; done
          ls -la >> lista.txt
      - name: Guardar
        run: |
          git config user.name "pronosticos-bot"; git config user.email "pronosticos-bot@users.noreply.github.com"
          git add registro/sonda && git commit -m "Sonda Understat" && git pull --rebase -q && git push
